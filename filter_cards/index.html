<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="overlay"></div>

    <div id="main">
        <div class="top-bar">
            <button class="add-btn">+</button>
            <input type="text" class="search-bar" placeholder="Search...">
        </div>
        <div class="modal">
            <form autocomplete="off">
                <label for="imageUrl">Image URL</label>
                <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg" required>

                <label for="heading">Heading</label>
                <input type="text" id="heading" placeholder="Enter heading" required>

                <label for="info">Info</label>
                <input type="text" class="info" placeholder="Enter additional information" required></input>

                <div class="buttons">
                    <button type="submit" class="confirm">Confirm</button>
                    <button type="button" class="cancel">Cancel</button>
                </div>
            </form>
        </div>
        <div class="cards">
