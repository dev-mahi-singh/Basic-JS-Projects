<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background color Changer</title>
   <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Helvetica;
    }

    html,body{
        height: 100%;
        width: 100%;
    }

    #main{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        background-color: #222;
    }

    #btn{
        padding: 12px 22px;
        background-color: rgb(59, 198, 198);
        border-radius: 5px;
        user-select: none;
        color: #696767;
        font-size: 22px;
        font-weight: 700;
        
    }

   </style>
</head>
<body>

    <div id="main">
        <div id="btn">Change Color</div>
    </div>


    <script src="script.js"></script>
</body>
</html>
