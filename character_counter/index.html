<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Character Counter UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="counter-container">
    <label for="message">Your Message</label>

    <textarea
      id="message"
      placeholder="Type something..."
      maxlength="200"
    ></textarea>

    <div class="counter">
      <span id="current-count">0</span>
      /
      <span id="max-count">200</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
